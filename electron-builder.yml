appId: io.github.blonestar.niimbotstudio
productName: Niimbot Studio
copyright: Copyright © 2026 blonestar
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json

# Releases are uploaded as a draft. Publish the draft on GitHub to make it
# visible to the auto-updater (mark it as a pre-release for beta testers).
publish:
  provider: github
  owner: blonestar
  repo: niimbot-studio
  releaseType: draft

win:
  target: [nsis]
  artifactName: Niimbot-Studio-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target: [AppImage, deb, rpm]
  icon: build/icons
  category: Office
  syncDesktopName: true
  maintainer: blonestar <blonestar@users.noreply.github.com>
  synopsis: Label designer for NIIMBOT printers
  artifactName: niimbot-studio-${version}-${arch}.${ext}

# Not signed with an Apple Developer ID yet: ad-hoc signature only. The app opens with
# right-click > Open the first time, and it cannot install updates itself (see main/updater.ts).
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.productivity
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    NSBluetoothAlwaysUsageDescription: Niimbot Studio connects to your label printer over Bluetooth.
  artifactName: Niimbot-Studio-${version}-${arch}.${ext}
